inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']

route:

  receiver: 'null'
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 2m

