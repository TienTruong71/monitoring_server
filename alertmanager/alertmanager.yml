global:
  slack_api_url_file: /etc/alertmanager/secrets/slack_url

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']

route:
  receiver: 'slack-warning'      
  group_by: ['alertname', 'instance']
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h            
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'slack-critical'

receivers:
- name: 'slack-critical'
  slack_configs:
  - channel: '#alerts'
    send_resolved: true
    title: '{{ template "slack.mon.title" . }}'
    text: '{{ template "slack.mon.text" . }}'
    color: 'danger'

- name: 'slack-warning'
  slack_configs:
  - channel: '#alerts'
    send_resolved: true
    title: '{{ template "slack.mon.title" . }}'
    text: '{{ template "slack.mon.text" . }}'
    color: 'warning'

templates:
- '/etc/alertmanager/templates/slack.tmpl'
