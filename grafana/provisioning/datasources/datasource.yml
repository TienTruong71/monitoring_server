apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      # Grafana đọc biến env native; PROM_WEB_PASS lấy từ .env
      basicAuthPassword: ${PROM_WEB_PASS}
    editable: true
