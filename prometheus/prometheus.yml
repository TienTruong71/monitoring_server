global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "rules/node_exporter.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    basic_auth:
      username: "admin"
      password_file: "/etc/prometheus/secrets/prometheus_pass"

  - job_name: "node-aws"
    basic_auth:
      username: "node_exporter"
      password_file: "/etc/prometheus/secrets/exporter_pass"
    ec2_sd_configs:
      - region: "us-east-1"
        port: 9100
        refresh_interval: 60s
        filters:
          - { name: "tag:Monitoring", values: ["node"] }
          - { name: "instance-state-name", values: ["running"] }
    relabel_configs:
      # Scrape the private IP on the node_exporter port
      - source_labels: [__meta_ec2_private_ip]
        target_label: __address__
        replacement: "${1}:9100"

      # Map EC2 metadata to readable labels
      - { source_labels: [__meta_ec2_private_ip],        target_label: instance }
      - { source_labels: [__meta_ec2_tag_Name],          target_label: hostname }
      - { source_labels: [__meta_ec2_instance_id],       target_label: instance_id }
      - { source_labels: [__meta_ec2_instance_type],     target_label: instance_type }
      - { source_labels: [__meta_ec2_availability_zone], target_label: az }
      - { source_labels: [__meta_ec2_tag_Project],       target_label: project }
      - { source_labels: [__meta_ec2_tag_Owner],         target_label: owner }
