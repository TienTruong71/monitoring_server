global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - rules/node_exporter.yml

scrape_configs:
  - job_name: "prometheus"
    basic_auth:
      username: "admin"
      password_file: /etc/prometheus/secrets/exporter_pass
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-finepro"
    basic_auth:
      username: "node_exporter"
      password_file: /etc/prometheus/secrets/exporter_pass
    static_configs:
      - targets: ["192.168.160.76:9100"]
        labels: { hostname: "fedev",      env: "finepro" }
      - targets: ["192.168.160.78:9100"]
        labels: { hostname: "bedev",      env: "finepro" }
      - targets: ["192.168.160.79:9100"]
        labels: { hostname: "mcrservice", env: "finepro" }
      - targets: ["192.168.160.80:9100"]
        labels: { hostname: "data",       env: "finepro" }
      - targets: ["192.168.160.81:9100"]
        labels: { hostname: "gitlab",     env: "finepro" }
      - targets: ["192.168.160.95:9100"]
        labels: { hostname: "devserver",  env: "finepro" }

    relabel_configs:
      - source_labels: [__address__]
        separator: ':'
        regex: '(.*):(.*)'
        replacement: '${1}'
        target_label: instance

  - job_name: "node-vcast"
    basic_auth:
      username: "node_exporter"
      password_file: /etc/prometheus/secrets/exporter_pass
    static_configs:
      - targets: ["192.168.8.61:9100"]
        labels: { hostname: "fedev",        env: "vcast" }
      - targets: ["192.168.8.62:9100"]
        labels: { hostname: "bedev",        env: "vcast" }
      - targets: ["192.168.8.63:9101"]
        labels: { hostname: "mcrservice",   env: "vcast" }
      - targets: ["192.168.8.64:9100"]
        labels: { hostname: "data",         env: "vcast" }
      - targets: ["192.168.8.66:9100"]
        labels: { hostname: "load-balancer", env: "vcast" }
      - targets: ["192.168.8.67:9100"]
        labels: { hostname: "apifinetags",  env: "vcast" }
    relabel_configs:
      - source_labels: [__address__]
        separator: ':'
        regex: '(.*):(.*)'
        replacement: '${1}'
        target_label: instance
